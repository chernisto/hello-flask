services:
  web:
    image: hello-flask:${APP_VERSION:-latest}
    container_name: hello-flask
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
