services:
  web:
    image: hello-flask:${APP_VERSION:?APP_VERSION must be set}
    container_name: hello-flask-${ENV_NAME:?ENV_NAME must be set}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:?HOST_PORT must be set}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m